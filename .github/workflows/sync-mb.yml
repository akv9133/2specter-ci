name: Sync source mb (new chapters and new series)

# Reads the source's site-wide latest-updates feed, fetches the series that are behind and
# imports listed series we do not hold (up to MB_NEW_REQUESTS a run), additive only
# (sync/mb_latest.py). The Monday 06:47 UTC run also diffs the sitemap for series added
# without an update. The daily sync-freshness check alerts if this stops producing chapters.

on:
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-mb
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45            # 3 h run about 15 min at most, the weekly sitemap pass about 15 more
    env:
      D1_PROXY_URL: ${{ secrets.D1_PROXY_URL }}
      D1_PROXY_SECRET: ${{ secrets.D1_PROXY_SECRET }}
      DB_BACKEND: d1
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: prep
        uses: ./.github/actions/prep
        with:
          need: D1_PROXY_URL D1_PROXY_SECRET RESEND_API_KEY ALERT_EMAIL EMAIL_FROM
          deploy-key: ${{ secrets.CODE_DEPLOY_KEY }}
          code-repo: ${{ vars.CODE_REPO }}
      - id: selftest
        name: Prove the statements still hold
        working-directory: code
        run: bash "$GITHUB_WORKSPACE/quiet.sh" python -m pytest tests/test_mb_latest.py -q
      - id: sync
        name: Add new chapters
        working-directory: code
        run: bash "$GITHUB_WORKSPACE/quiet.sh" python -m sync.mb_latest
      - id: discover
        name: Sitemap pass for series added without an update (Monday 06:47 UTC run)
        working-directory: code
        run: |
          if [ "$(date -u +%u%H)" = "106" ]; then bash "$GITHUB_WORKSPACE/quiet.sh" python -m sync.mb_latest --discover; fi
      - name: Mail on failure
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 "$GITHUB_WORKSPACE/mail_failure.py"
