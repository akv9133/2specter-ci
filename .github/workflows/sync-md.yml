name: Sync source md (new chapters, other languages, new manga)

# Reads the source's site-wide chapter feed in the 8 languages the load carried and adds new
# chapters to the md series we hold and the kg rows linked to them, additive only
# (sync/md_latest.py). The 03:17 UTC run also adds the manga created in the last 48 h. The
# daily sync-freshness check alerts if this stops producing chapters.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-md
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      D1_PROXY_URL: ${{ secrets.D1_PROXY_URL }}
      D1_PROXY_SECRET: ${{ secrets.D1_PROXY_SECRET }}
      DB_BACKEND: d1
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: prep
        uses: ./.github/actions/prep
        with:
          need: D1_PROXY_URL D1_PROXY_SECRET RESEND_API_KEY ALERT_EMAIL EMAIL_FROM
          deploy-key: ${{ secrets.CODE_DEPLOY_KEY }}
          code-repo: ${{ vars.CODE_REPO }}
      - id: selftest
        name: Prove the statements still hold
        working-directory: code
        run: bash "$GITHUB_WORKSPACE/quiet.sh" python -m pytest tests/test_md_latest.py -q
      - id: sync
        name: Add new chapters
        working-directory: code
        run: bash "$GITHUB_WORKSPACE/quiet.sh" python -m sync.md_latest
      - id: new_manga
        name: Add new manga (03:17 UTC run)
        working-directory: code
        run: |
          if [ "$(date -u +%H)" = "03" ]; then bash "$GITHUB_WORKSPACE/quiet.sh" python -m sync.md_latest --new-manga; fi
      - name: Mail on failure
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 "$GITHUB_WORKSPACE/mail_failure.py"
