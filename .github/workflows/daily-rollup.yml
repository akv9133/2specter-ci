name: Daily view rollup

on:
  schedule:
    - cron: '5 3 * * *'
  workflow_dispatch:

concurrency:
  group: daily-rollup
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # the local prep action and mail_failure.py live in this repo: without a checkout every run since
      # the 10-13 publish failed at "Can't find 'action.yml'", and its failure mail failed with it
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prep
        with:
          need: RESEND_API_KEY ALERT_EMAIL EMAIL_FROM
          deploy-key: ${{ secrets.CODE_DEPLOY_KEY }}
          code-repo: ${{ vars.CODE_REPO }}
          python: ''

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: code/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/pnpm-lock.yaml
      - name: Install
        working-directory: code
        run: bash "$GITHUB_WORKSPACE/quiet.sh" pnpm install --frozen-lockfile

      - name: Rollup
        working-directory: code
        env:
          D1_PROXY_URL:    ${{ secrets.D1_PROXY_URL }}
          D1_PROXY_SECRET: ${{ secrets.D1_PROXY_SECRET }}
        run: |
          set -eo pipefail
          pnpm rollup 2>&1 | tee /tmp/rollup.log

      - name: Mail on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:     ${{ secrets.EMAIL_FROM }}
          ALERT_EMAIL:    ${{ secrets.ALERT_EMAIL }}
          STEPS_JSON:     ${{ toJSON(steps) }}
        run: python3 "$GITHUB_WORKSPACE/mail_failure.py"
