name: Mint watch (is the page-list minter minting?)

# Hourly look at the minter Worker's /status and /watchdog and the last 24 h of mint results.
# Emails once when a problem starts and once when all clear, never every run: nothing minting
# while books wait, the phone on an outdated minter for over an hour, the source refusing,
# a renumbering wave (404 share), or the Worker not answering. Runs on GitHub's runners so it
# does not share fate with the Worker's own cron. The Worker URL comes from a secret.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mint-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MINT_URL: ${{ secrets.MINT_URL }}
      MINT_SECRET: ${{ secrets.MINT_SECRET }}
      D1_PROXY_URL: ${{ secrets.D1_PROXY_URL }}
      D1_PROXY_SECRET: ${{ secrets.D1_PROXY_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: prep
        uses: ./.github/actions/prep
        with:
          need: MINT_URL MINT_SECRET D1_PROXY_URL D1_PROXY_SECRET RESEND_API_KEY ALERT_EMAIL EMAIL_FROM
          deploy-key: ${{ secrets.CODE_DEPLOY_KEY }}
          code-repo: ${{ vars.CODE_REPO }}
      - id: selftest
        name: Prove the checker still fires
        working-directory: code
        run: bash "$GITHUB_WORKSPACE/quiet.sh" python -m pytest tests/test_mint_watch.py -q
      # last run's state, so it mails once per change and not every hour
      - uses: actions/cache/restore@v4
        with:
          path: .mint-watch
          key: mint-watch-${{ github.run_id }}
          restore-keys: mint-watch-
      - id: check
        name: Check the minter
        working-directory: code
        # exit 1 = a problem is active (already mailed on the change); 2 = the check itself broke
        run: |
          set +e
          python -m sync.mint_watch --state "$GITHUB_WORKSPACE/.mint-watch/state.json"
          c=$?
          echo "code=$c" >> "$GITHUB_OUTPUT"
          exit $c
      - if: always() && steps.check.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .mint-watch
          key: mint-watch-${{ github.run_id }}
      - name: Mail when the check itself broke
        if: failure() && steps.check.outputs.code != '1'
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 "$GITHUB_WORKSPACE/mail_failure.py"
