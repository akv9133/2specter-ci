name: Cloudflare usage alert (D1 rows and storage, Worker requests)

# The account is on Workers Paid (2026-09-28): allowances are monthly from the
# subscription's renewal date, and overage is billed. Checked daily, since a
# crossing lasts until the period resets and a tighter cadence would only
# repeat the same mail. Goes red and mails when anything crosses. The token
# needs Account Analytics: Read, D1 read and billing read. CF_PLAN=free
# switches to the free plan's hard daily caps if the plan ever changes back.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      threshold:
        description: rows_read threshold (default 10000000000)
        required: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      CF_PLAN: paid
      D1_DATABASE_NAME: 2mc
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      D1_ROWS_READ_ALERT: ${{ inputs.threshold || '10000000000' }}
      D1_ROWS_WRITTEN_ALERT: '25000000'
      D1_STORAGE_ALERT: '4000000000'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: prep
        uses: ./.github/actions/prep
        with:
          need: CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_DATABASE_ID RESEND_API_KEY ALERT_EMAIL EMAIL_FROM
          deploy-key: ${{ secrets.CODE_DEPLOY_KEY }}
          code-repo: ${{ vars.CODE_REPO }}
          python: '3.12'
      - id: check
        working-directory: code
        run: bash "$GITHUB_WORKSPACE/quiet.sh" python scripts/monitor/d1_usage.py
      - name: Mail on failure
        if: failure()
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python3 "$GITHUB_WORKSPACE/mail_failure.py"
